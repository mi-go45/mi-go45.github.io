<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miggo45 | Portfolio & Hub</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --sub-text: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .profile-card {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
            border: 1px solid #334155;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            margin: 0 auto 20px;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.4);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .handle {
            color: var(--accent-color);
            font-size: 16px;
            margin-bottom: 16px;
        }

        .bio {
            color: var(--sub-text);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .links-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--sub-text);
            margin-bottom: 12px;
            text-align: left;
        }

        .link-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #334155;
            color: var(--text-color);
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .link-btn:hover {
            background-color: var(--accent-color);
            color: #0f172a;
            transform: translateY(-2px);
        }

        .badge {
            font-size: 11px;
            background-color: rgba(255, 255, 255, 0.2);
            padding: 2px 8px;
            border-radius: 12px;
        }

        footer {
            margin-top: 24px;
            font-size: 12px;
            color: var(--sub-text);
        }
        .avatar-img {
    width: 100px;
    height: 100px;
    border-radius: 50%; /* 丸く切り抜く場合（四角のままならこの行を削除） */
    object-fit: cover;
    margin: 0 auto 20px;
    display: block;
    box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
}
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-card">
            <!-- アイコン（文字または画像に置き換え可能） -->
            <img src="icon.png" alt="Miggo45 Icon" class="avatar-img">

            <h1>Miggo45</h1>
            <div class="handle">@miggo.uk</div>

            <p class="bio">
              
                自宅サーバーでWebサービスやインフラを構築・運用中。
            </p>

            <div class="links-title">Services & Links</div>

            <div class="link-list">
                <!-- 自宅サーバー内の他サービスへのリンク -->
                <a href="https://miggo45.ie-t.net/" class="link-btn">
                    <span>MPS</span>
                    <span class="badge">miggo45.ie-t.net</span>
                </a>
                
                <!-- GitHubやXなど（必要に応じて書き換えてください） -->
                <a href="https://github.com/mi-go45" target="_blank" class="link-btn">
                    <span>GitHub</span>
                    <span class="badge">External</span>
                </a>
            </div>

            <footer>
                &copy; 2026 Miggo45. Hosted on Private Raspberry Pi.
            </footer>
        </div>
    </div>
</body>
</html>
